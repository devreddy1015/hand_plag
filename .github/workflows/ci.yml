name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # pdf.js asks for >= 22.13 and vitest for ^22.12 || ^24 || >= 26;
          # 24 satisfies everything and matches the runner's own Node.
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      # The website, then the same editor built for the app.
      - run: npm run build
      - run: npm run app:build
